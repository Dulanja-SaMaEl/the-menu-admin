sonar.projectKey=Dulanja-SaMaEl_the-menu
sonar.organization=dulanja-samael

# Sources and Exclusions
sonar.sources=app,config,routes
sonar.exclusions=resources/views/**,database/**,public/**,tests/**
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=**/*

# Ignore HTML/Web false-positive rules on Blade components
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
